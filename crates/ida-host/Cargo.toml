[package]
name = "ida-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Out-of-process idalib host speaking the ida-proto protocol"

[[bin]]
name = "ida-host"
path = "src/main.rs"

[dependencies]
ida-proto = { path = "../ida-proto" }
serde_json = { version = "1", features = ["raw_value"] }

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
