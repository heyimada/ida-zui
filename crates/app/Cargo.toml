[package]
name = "ida-zui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A modern IDA Pro front end on zui (gpui), driving headless idalib"

[dependencies]
ida-proto = { path = "../ida-proto" }
zui-editor = { path = "../zui-editor" }
gpui.workspace = true
gpui_platform.workspace = true
futures = "0.3"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
